<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 130" width="640" height="130" font-family="'Fira Code','Cascadia Code',Consolas,monospace">
  <rect width="640" height="130" fill="none"/>

  <style>
    .ln { font-size: 27px; font-weight: 600; fill: #c25e00; text-anchor: middle; }
    .l1 { animation: c1 12s infinite; }
    .l2 { opacity: 0; animation: c2 12s infinite; }
    .l3 { opacity: 0; animation: c3 12s infinite; }
    @keyframes c1 { 0%,26% {opacity:1} 31%,100% {opacity:0} }
    @keyframes c2 { 0%,30% {opacity:0} 35%,61% {opacity:1} 66%,100% {opacity:0} }
    @keyframes c3 { 0%,65% {opacity:0} 70%,96% {opacity:1} 100% {opacity:0} }
    .cur { fill: #0b4f8a; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- estado estático (app mobile / sem CSS): só a linha 1 aparece -->
  <text class="ln l1" x="320" y="58">Olá, eu sou Dev Marinho!</text>
  <text class="ln l2" x="320" y="58">Estudante de ADS — 4º período</text>
  <text class="ln l3" x="320" y="58">Back-end · Dados/IA · Games</text>

  <rect class="cur" x="556" y="36" width="11" height="28" rx="2"/>

  <rect x="210" y="92" width="220" height="3" rx="2" fill="#0b4f8a" opacity="0.55"/>
</svg>
